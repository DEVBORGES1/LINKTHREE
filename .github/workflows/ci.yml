# Verifica que o projeto continua construindo, e que o que esta versionado em
# public/ bate com o que o build gera.
#
# Nao publica nada: quem serve o site e a Vercel, que roda o proprio build a
# cada push na main. Ate setembro de 2026 este arquivo tambem publicava no
# GitHub Pages, e o site ficava no ar em dois lugares ao mesmo tempo -- com o
# Pages servindo uma versao sem o token de medicao. O deploy saiu; a checagem
# ficou, porque e ela que pega imagem de origem editada sem rodar o build.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gera imagens WebP, subset do Font Awesome e fontes auto-hospedadas.
      - name: Build assets
        run: npm run build

      # Falha se `npm run build` mudou algo versionado: significa que alguem
      # editou uma imagem de origem sem rodar o build antes de commitar.
      - name: Check generated assets are up to date
        run: |
          if [ -n "$(git status --porcelain public)" ]; then
            echo "::error::public/ ficou diferente depois de 'npm run build'."
            echo "Rode 'npm run build' localmente e faca commit do resultado."
            git status --porcelain public
            exit 1
          fi

      # Mesma etapa que a Vercel roda: se quebrar aqui, o deploy quebraria la.
      - name: Minify HTML/CSS/JS
        run: npm run minify
